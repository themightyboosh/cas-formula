<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Black background -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Valence gradient bar -->
  <defs>
    <linearGradient id="valenceGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#cc0000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffaa00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44ee00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="0" y="315" width="1200" height="8" fill="url(#valenceGradient)"/>

  <!-- Title -->
  <text x="600" y="250" font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">
    Feel it, Don't Think It
  </text>

  <!-- Subtitle -->
  <text x="600" y="400" font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, sans-serif" font-size="32" fill="#999999" text-anchor="middle">
    Understand what your body is telling you
  </text>
</svg>
